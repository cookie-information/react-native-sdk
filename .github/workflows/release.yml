name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 2.1.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  NPM_PACKAGE: '@cookieinformation/react-native-sdk'

jobs:
  release:
    name: Validate and release
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.0'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Validate version
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the X.Y.Z format without a v prefix."
            exit 1
          fi

      - name: Inspect existing artifacts
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags origin

          TAG_EXISTS=false
          NPM_EXISTS=false
          RELEASE_EXISTS=false

          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            TAG_EXISTS=true
          fi

          if npm view "$NPM_PACKAGE@$RELEASE_VERSION" version >/dev/null 2>&1; then
            NPM_EXISTS=true
          fi

          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "npm_exists=$NPM_EXISTS" >> "$GITHUB_OUTPUT"
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS npm_exists=$NPM_EXISTS release_exists=$RELEASE_EXISTS"

          if [[ "$TAG_EXISTS" == true && "$NPM_EXISTS" == true && "$RELEASE_EXISTS" == true ]]; then
            echo "Version $RELEASE_VERSION is already fully released."
            exit 1
          fi

          if [[ "$TAG_EXISTS" != true ]]; then
            latest="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
            if [[ -n "$latest" ]] && [[ "$(printf '%s\n%s\n' "$latest" "$RELEASE_VERSION" | sort -V | head -n 1)" == "$RELEASE_VERSION" ]] && [[ "$latest" != "$RELEASE_VERSION" ]]; then
              echo "Version $RELEASE_VERSION is older than existing tag $latest."
              exit 1
            fi
          fi

      - name: Bump package version
        if: steps.state.outputs.tag_exists != 'true'
        run: npm version --no-git-tag-version "$RELEASE_VERSION"

      - name: Bump Android library version
        if: steps.state.outputs.tag_exists != 'true'
        run: |
          python3 <<'PY'
          import os
          import re

          version = os.environ["RELEASE_VERSION"]
          paths = [
              "android/build.gradle",
              "android/tests/react-native-cookie-information-rnsdk/build.gradle",
          ]

          def bump_code(text):
              match = re.search(r"versionCode\s+(\d+)", text)
              if match is None:
                  raise SystemExit("Expected versionCode in Gradle file")
              name = re.search(r'versionName\s+"([^"]+)"', text)
              if name and name.group(1) == version:
                  return text
              return re.sub(
                  r"versionCode\s+\d+",
                  f"versionCode {int(match.group(1)) + 1}",
                  text,
                  count=1,
              )

          for path in paths:
              source = open(path).read()
              updated = bump_code(source)
              updated = re.sub(
                  r"^version = '[^']+'",
                  f"version = '{version}'",
                  updated,
                  count=1,
                  flags=re.M,
              )
              updated = re.sub(
                  r'versionName\s+"[^"]+"',
                  f'versionName "{version}"',
                  updated,
                  count=1,
              )
              open(path, "w").write(updated)
              if f'versionName "{version}"' not in updated:
                  raise SystemExit(f"Failed to set versionName in {path}")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        if: steps.state.outputs.tag_exists != 'true'
        run: |
          npm run lint
          npm run typescript
          npm test
          npm run build

      - name: Run Android tests
        if: steps.state.outputs.tag_exists != 'true'
        run: npm run test:android

      - name: Run iOS tests
        if: steps.state.outputs.tag_exists != 'true'
        run: |
          set -a
          source scripts/ios-simulator.env
          set +a
          npm run test:ios

      - name: Commit release version
        if: steps.state.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json package-lock.json android/build.gradle android/tests/react-native-cookie-information-rnsdk/build.gradle; then
            echo "Release files already use version $RELEASE_VERSION."
          else
            git add package.json package-lock.json android/build.gradle android/tests/react-native-cookie-information-rnsdk/build.gradle
            git commit -m "Release $RELEASE_VERSION"
          fi

      - name: Push commit and tag
        if: steps.state.outputs.tag_exists != 'true'
        run: |
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push --atomic origin \
            "HEAD:$DEFAULT_BRANCH" \
            "refs/tags/$RELEASE_VERSION"

      - name: Create GitHub Release
        if: steps.state.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" \
            --verify-tag \
            --title "$RELEASE_VERSION" \
            --generate-notes

      - name: Install npm with staged publishing support
        if: steps.state.outputs.npm_exists != 'true'
        run: npm install --global npm@11.19.1

      - name: Stage package on npm
        if: steps.state.outputs.npm_exists != 'true'
        run: |
          npm run build
          npm stage publish --access public
